<h1>Zadanie 17 - Teoria</h1>

<h2><u><b>1. Wymień cztery sposoby wyprowadzania danych w JS.</b></u></h2>

<p><b>Odpowiedź:</b></p>

<ol>
    <li>document.write()</li>

<h2><u><b>2. Czym jest funkcja w JS?</b></u></h2>

<p><b>Odpowiedź:</b></p>

<ul>
    <li>Funkcja to zbiór instrukcji wykonujących określone zadanie.</li>
    <li>Funkcję uruchamiamy podając jej nazwę, np. mojaFunkcja().</li>
    <li>Funkcja może przyjmować argumenty, np. suma(a,b).</li>
    <li>Funkcja może zwracać wynik za pomocą return.</li>
</ul>


<h2><u><b>3. Omów metody getElementsByName, getElementById, getElementsByTagName.</b></u></h2>

<p><b>Odpowiedź:</b></p>

<table border="1">
    <tr>
        <th>Metoda</th>
        <th>Opis</th>
    </tr>

    <tr>
        <td>getElementById</td>
        <td>Wyszukuje element po jego id.</td>
    </tr>

    <tr>
        <td>getElementsByName</td>
        <td>Wyszukuje elementy po atrybucie name.</td>
    </tr>

    <tr>
        <td>getElementsByTagName</td>
        <td>Wyszukuje elementy po nazwie znacznika, np. p lub div.</td>
    </tr>
</table>


<h2><u><b>4. Omów właściwości innerHTML, innerText, className.</b></u></h2>

<p><b>Odpowiedź:</b></p>

<ul>
    <li><b>innerHTML</b> - pozwala odczytać lub zmienić kod HTML elementu.</li>

    <li><b>innerText</b> - pozwala odczytać lub zmienić tekst elementu.</li>

    <li><b>className</b> - pozwala ustawić lub zmienić klasę CSS elementu.</li>
</ul>


<h2>Przykład</h2>

<div id="nazwa"></div>

<script>
    document.getElementById("nazwa").innerHTML = "Witaj";
</script>

<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Spitsarev Maksim z13</title>
    <meta charset="utf-8">
</head>

<body>
<div style="color:green;font-size:50px;">

<script>
    var liczba1 = prompt("daj mianownik m=", "");
    var m_spi = parseFloat(liczba1);

    document.write("m = " + m_spi + "<br>");

    var m1 = m_spi + 1;
    var m2 = m_spi * (m_spi + 1);

    document.write(
        "1/" + m_spi + " = 1/" + m1 + " + 1/" + m2
    );
</script>

</div>
</body>
</html>
